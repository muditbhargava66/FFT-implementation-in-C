name: CI

on:
  push:
    branches: [main, "release/**"]
  pull_request:
  workflow_dispatch:

# Everything in this workflow only reads the repository.
permissions:
  contents: read

# A newer push to the same ref supersedes the run in flight.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# C builds run on Linux (GCC and Clang), macOS (Apple Clang), and Windows under
# MSYS2/MinGW-w64 (GCC and clang). Windows steps have to run inside the MSYS2
# shell, so that job carries its own compiler matrix; the macOS job uses the
# runner's default toolchain. A separate Linux job builds with ASan and UBSan.
# The docs job is independent and builds MkDocs in strict mode.
#
# FFT_ENABLE_CUDA is exercised by a compile-and-skip job in an NVIDIA CUDA
# container. GitHub-hosted runners have no GPU, so test_gpu_cuda reports a skip
# (exit 77); real-device execution is verified locally on a GTX 1050 under WSL.
# The macOS job additionally builds the opt-in Metal backend. test_gpu_metal
# checks a real MPSGraph result when the runner exposes a Metal device and
# reports a skip when it does not; the build and -Werror check run either way.

jobs:
  linux:
    name: Linux / ${{ matrix.cc }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]

    steps:
      - uses: actions/checkout@v7

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_C_COMPILER=${{ matrix.cc }} -DCMAKE_C_FLAGS=-Werror

      - name: Build
        run: cmake --build build 2>&1 | tee build.log

      # The project compiles with -Wall -Wextra and is warning-clean, so treat a
      # new warning as a failure rather than letting it accumulate unnoticed.
      - name: Fail on compiler warnings
        run: |
          if grep -q "warning:" build.log; then
            echo "Compiler warnings are not allowed:"
            grep -n "warning:" build.log
            exit 1
          fi

      - name: Test
        run: ctest --test-dir build --output-on-failure

      # benchmark_all exits 0 even when a row reports FAIL, so the pass/fail
      # counts have to be read out of its output for this step to mean anything.
      - name: Benchmark smoke test
        run: |
          ./build/bin/benchmark_all | tee bench.log
          grep -E "^Failed: 0 " bench.log >/dev/null || {
            echo "benchmark_all reported failing rows:"; grep -E "^Failed:" bench.log; exit 1; }

      - name: Run application demos
        run: |
          for app in audio_spectrum convolution demo_features fft_filtering \
                     image_fft pitch_detection power_spectrum gpu_benchmark; do
            echo "== $app"
            ./build/bin/$app >/dev/null
          done
          printf "\n" | timeout 120 ./build/bin/realtime_analyzer >/dev/null

  macos:
    name: macOS / Apple Clang
    runs-on: macos-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v7

      - name: Configure
        run: cmake -S . -B build -DCMAKE_C_FLAGS=-Werror

      - name: Build
        run: cmake --build build 2>&1 | tee build.log

      - name: Fail on compiler warnings
        run: |
          if grep -q "warning:" build.log; then
            echo "Compiler warnings are not allowed:"
            grep -n "warning:" build.log
            exit 1
          fi

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Benchmark smoke test
        run: |
          ./build/bin/benchmark_all | tee bench.log
          grep -E "^Failed: 0 " bench.log >/dev/null || {
            echo "benchmark_all reported failing rows:"; grep -E "^Failed:" bench.log; exit 1; }

      - name: Run application demos
        run: |
          for app in audio_spectrum convolution demo_features fft_filtering \
                     image_fft pitch_detection power_spectrum gpu_benchmark; do
            echo "== $app"
            ./build/bin/$app >/dev/null
          done
          printf "\n" | ./build/bin/realtime_analyzer >/dev/null

      - name: Build Metal backend
        run: >
          cmake -S . -B build-metal -DFFT_ENABLE_METAL=ON
          -DCMAKE_C_FLAGS=-Werror -DCMAKE_OBJC_FLAGS=-Werror &&
          cmake --build build-metal --target test_gpu_metal 2>&1 | tee build-metal.log

      - name: Fail on Metal compiler warnings
        run: |
          if grep -q "warning:" build-metal.log; then
            echo "Compiler warnings are not allowed:"
            grep -n "warning:" build-metal.log
            exit 1
          fi

      - name: Test Metal backend
        run: ctest --test-dir build-metal -R test_gpu_metal --output-on-failure

  sanitizers:
    name: Linux / ASan + UBSan
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_C_COMPILER=clang
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -g"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"

      - name: Build
        run: cmake --build build

      # halt_on_error makes UBSan abort on the first report so a diagnostic is
      # not hidden inside a still-exiting-zero program. Leak detection is on
      # because this runner supports it; the macOS local runs could not.
      - name: Test
        run: |
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=halt_on_error=1 \
            ctest --test-dir build --output-on-failure

      - name: Run application demos
        run: |
          for app in audio_spectrum convolution demo_features fft_filtering \
                     image_fft pitch_detection power_spectrum gpu_benchmark; do
            echo "== $app"
            ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=halt_on_error=1 \
              ./build/bin/$app >/dev/null
          done
          printf "\n" | ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=halt_on_error=1 \
            timeout 120 ./build/bin/realtime_analyzer >/dev/null

  windows-mingw:
    name: Windows / MinGW-w64 ${{ matrix.compiler }} (ucrt64)
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]

    # MSVC's C compiler has no C11 _Complex arithmetic, which this library
    # requires, and CMakeLists.txt stops at configure time with an explanation
    # if cl.exe is selected. So the runner default is not usable here and a real
    # MinGW-w64 toolchain is installed instead.
    steps:
      - uses: actions/checkout@v7

      - name: Set up MinGW-w64 (ucrt64)
        uses: msys2/setup-msys2@v2.33.0
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            ${{ matrix.compiler == 'gcc' && 'mingw-w64-ucrt-x86_64-gcc' || 'mingw-w64-ucrt-x86_64-clang' }}

      - name: Configure
        shell: msys2 {0}
        run: cmake -S . -B build -G Ninja -DCMAKE_C_COMPILER=${{ matrix.compiler }}

      - name: Build
        shell: msys2 {0}
        run: cmake --build build 2>&1 | tee build.log

      - name: Fail on compiler warnings
        shell: msys2 {0}
        run: |
          if grep -q "warning:" build.log; then
            echo "Compiler warnings are not allowed:"
            grep -n "warning:" build.log
            exit 1
          fi

      - name: Test
        shell: msys2 {0}
        run: ctest --test-dir build --output-on-failure

      - name: Benchmark smoke test
        shell: msys2 {0}
        run: |
          ./build/bin/benchmark_all | tee bench.log
          grep -E "^Failed: 0 " bench.log >/dev/null || {
            echo "benchmark_all reported failing rows:"; grep -E "^Failed:" bench.log; exit 1; }

      - name: Run application demos
        shell: msys2 {0}
        run: |
          for app in audio_spectrum convolution demo_features fft_filtering \
                     image_fft pitch_detection power_spectrum gpu_benchmark; do
            echo "== $app"
            ./build/bin/$app.exe >/dev/null
          done
          printf "\n" | ./build/bin/realtime_analyzer.exe >/dev/null

  cuda-compile:
    name: Linux / CUDA (build, no device)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    container:
      image: nvidia/cuda:12.6.3-devel-ubuntu22.04

    steps:
      # The CUDA devel images ship no git, and actions/checkout needs it.
      - name: Install git
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            git ca-certificates

      - uses: actions/checkout@v7

      - name: Install build tools
        run: |
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            wget xz-utils ninja-build gcc g++ make
          wget -q https://github.com/Kitware/CMake/releases/download/v3.29.2/cmake-3.29.2-linux-x86_64.tar.gz -O /tmp/cmake.tar.gz
          tar -xzf /tmp/cmake.tar.gz -C /opt
          ln -sf /opt/cmake-3.29.2-linux-x86_64/bin/cmake /usr/local/bin/cmake
          ln -sf /opt/cmake-3.29.2-linux-x86_64/bin/ctest /usr/local/bin/ctest

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_C_COMPILER=gcc
          -DFFT_ENABLE_CUDA=ON
          -DCMAKE_C_FLAGS=-Werror

      - name: Build
        shell: bash
        run: |
          set -o pipefail
          cmake --build build 2>&1 | tee build.log

      # nvcc formats its diagnostics as "nvcc warning :", so match optional
      # whitespace before the colon as well as GCC/Clang's "warning:".
      - name: Fail on compiler warnings
        run: |
          if grep -qE "warning[[:space:]]*:" build.log; then
            echo "Compiler warnings are not allowed:"
            grep -nE "warning[[:space:]]*:" build.log
            exit 1
          fi

      # No GPU is attached to a hosted runner. test_gpu_cuda exits 77 and CTest
      # records the test as skipped; everything else still has to pass.
      - name: Test
        run: ctest --test-dir build --output-on-failure

  docs:
    name: Docs / MkDocs (strict)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/requirements.txt

      - name: Install documentation dependencies
        run: python -m pip install -r docs/requirements.txt

      # --strict turns broken navigation, unresolved links and build warnings
      # into failures, so the published site cannot silently rot.
      - name: Build documentation
        run: python -m mkdocs build --strict -f docs/mkdocs.yml -d "$RUNNER_TEMP/docs-site"
