name: macOS Apple Silicon

# GitHub-hosted arm64 macOS runners exist, but their pool is capacity-limited,
# so this lane is manual and never gates a pull request. Run it before a
# release or after changing the Metal backend.
on:
  workflow_dispatch:
    inputs:
      runner:
        description: Hosted macOS arm64 runner label
        required: true
        default: macos-26
        type: choice
        options:
          - macos-26
          - macos-15

permissions:
  contents: read

concurrency:
  group: macos-arm64-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: macOS arm64 / Apple Clang
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: Configure
        run: cmake -S . -B build -DCMAKE_C_FLAGS=-Werror

      - name: Build
        run: cmake --build build 2>&1 | tee build.log

      - name: Fail on compiler warnings
        run: |
          if grep -q "warning:" build.log; then
            echo "Compiler warnings are not allowed:"
            grep -n "warning:" build.log
            exit 1
          fi

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Benchmark smoke test
        run: |
          ./build/bin/benchmark_all | tee bench.log
          grep -E "^Failed: 0 " bench.log >/dev/null || {
            echo "benchmark_all reported failing rows:"; grep -E "^Failed:" bench.log; exit 1; }

      - name: Run application demos
        run: |
          for app in audio_spectrum convolution demo_features fft_filtering \
                     image_fft pitch_detection power_spectrum gpu_benchmark; do
            echo "== $app"
            ./build/bin/$app >/dev/null
          done
          printf "\n" | ./build/bin/realtime_analyzer >/dev/null

      - name: Build Metal backend
        run: >
          cmake -S . -B build-metal -DFFT_ENABLE_METAL=ON
          -DCMAKE_C_FLAGS=-Werror -DCMAKE_OBJC_FLAGS=-Werror &&
          cmake --build build-metal --target test_gpu_metal 2>&1 | tee build-metal.log

      - name: Fail on Metal compiler warnings
        run: |
          if grep -q "warning:" build-metal.log; then
            echo "Compiler warnings are not allowed:"
            grep -n "warning:" build-metal.log
            exit 1
          fi

      - name: Test Metal backend
        run: ctest --test-dir build-metal -R test_gpu_metal --output-on-failure
