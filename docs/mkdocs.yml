# Configuration for MkDocs (ReadTheDocs with Markdown)
site_name: FFT Implementation in C
site_description: A comprehensive collection of Fast Fourier Transform algorithms in C
site_author: FFT Study Repository Contributors
site_url: https://fft-implementation-in-c.readthedocs.io/
copyright: Copyright 2024-2026 Mudit Bhargava. Apache License 2.0. Release 3.0.0
repo_url: https://github.com/muditbhargava66/FFT-implementation-in-C
repo_name: FFT-implementation-in-C

docs_dir: .

theme:
  name: material
  language: en
  palette:
    - scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
      primary: indigo
      accent: indigo
    - scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
      primary: indigo
      accent: indigo
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.tabs.link
    - content.code.annotation
    - content.code.copy

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [".."]  # Optional: remove if not using imports outside `docs_dir`

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/muditbhargava66/FFT-implementation-in-C

markdown_extensions:
  - admonition
  - footnotes
  - attr_list
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.mark
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.arithmatex:
      generic: true

nav:
  - Home: index.md
  - Getting Started:
      - Installation: getting-started.md
      - Quick Start: quickstart.md
      - Windows Support: windows.md
  - Algorithms: algorithms.md
  - Applications: applications.md
  - API Reference: api-reference.md
  - Performance:
      - Benchmarks: performance.md
      - Optimization Guide: optimizations.md

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
